<svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="112" fill="#0c0d0f"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#26282e" stroke-width="4"/>
  
  <!-- Subtle ambient glow -->
  <radialGradient id="hub-glow" cx="50%" cy="50%" r="60%">
    <stop offset="0%" stop-color="#ff6600" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#ff6600" stop-opacity="0"/>
  </radialGradient>
  <circle cx="256" cy="256" r="220" fill="url(#hub-glow)"/>

  <!-- Brand Typography -->
  <g id="brand-text">
    <text x="256" y="270" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="94" letter-spacing="-3">
      <tspan fill="#ffffff">goar</tspan><tspan fill="#ff6600">xyz</tspan>
    </text>
  </g>

  <!-- 3 Generic Category Icons Inline (Gamepad, Music, Video) -->
  <g transform="translate(146, 310)" stroke="#ff6600" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Gamepad -->
    <g transform="translate(0, 0)">
      <rect x="2" y="5" width="28" height="17" rx="3" stroke="#ff6600" fill="#181a1f"/>
      <path d="M8 13.5h6"/>
      <path d="M11 10.5v6"/>
      <circle cx="21" cy="14" r="1.5" fill="#ff6600"/>
      <circle cx="25.5" cy="11.5" r="1.5" fill="#ff6600"/>
    </g>

    <!-- Music Note -->
    <g transform="translate(90, 0)">
      <path d="M12 24V6l16-3v18" stroke="#ffffff"/>
      <circle cx="8" cy="24" r="4" fill="#ff6600" stroke="#ff6600"/>
      <circle cx="24" cy="21" r="4" fill="#ff6600" stroke="#ff6600"/>
    </g>

    <!-- Video / Anime Screen -->
    <g transform="translate(180, 0)">
      <rect x="2" y="6" width="30" height="20" rx="3" stroke="#ff6600" fill="#181a1f"/>
      <polygon points="14,11 14,21 22,16" fill="#ffffff" stroke="#ffffff"/>
    </g>
  </g>
</svg>
