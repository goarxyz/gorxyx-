<svg viewBox="0 0 380 90" width="380" height="90" xmlns="http://www.w3.org/2000/svg">
  <rect width="380" height="90" rx="18" fill="#0c0d0f"/>
  <rect x="2" y="2" width="376" height="86" rx="16" fill="none" stroke="#26282e" stroke-width="1.5"/>

  <!-- Brand Typography -->
  <text x="32" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="44" letter-spacing="-1.5">
    <tspan fill="#ffffff">goar</tspan><tspan fill="#ff6600">xyz</tspan>
  </text>

  <!-- Divider -->
  <line x1="220" y1="26" x2="220" y2="64" stroke="#2c2d33" stroke-width="2"/>

  <!-- 3 Generic Category Icons Inline (Games, Music, Anime) -->
  <g transform="translate(236, 32)" stroke="#ff6600" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Gamepad -->
    <g transform="translate(0, 0)">
      <rect x="2" y="4" width="22" height="14" rx="2" stroke="#ff6600" fill="#181a1f"/>
      <path d="M6 11h4"/>
      <path d="M8 9v4"/>
      <circle cx="17" cy="11.5" r="1" fill="#ff6600"/>
      <circle cx="20" cy="9.5" r="1" fill="#ff6600"/>
    </g>

    <!-- Music Note -->
    <g transform="translate(38, 0)">
      <path d="M7 19V5l12-2v14" stroke="#ffffff"/>
      <circle cx="4" cy="19" r="3" fill="#ff6600" stroke="#ff6600"/>
      <circle cx="16" cy="17" r="3" fill="#ff6600" stroke="#ff6600"/>
    </g>

    <!-- Anime / Video -->
    <g transform="translate(76, 0)">
      <rect x="2" y="4" width="22" height="15" rx="2" stroke="#ff6600" fill="#181a1f"/>
      <polygon points="10,8 10,15 16,11.5" fill="#ffffff" stroke="#ffffff"/>
    </g>
  </g>
</svg>
